<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potion Master: Ghost Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b091a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background: linear-gradient(135deg, #18122b, #0b091a);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
            position: relative;
        }
        /* الشريط العُلوي للإعدادات والصوت */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #8a2be2;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: 0.3s;
        }
        .icon-btn:hover {
            background: #8a2be2;
            transform: scale(1.05);
        }
        /* الشعار والأيقونة */
        .logo-area {
            text-align: center;
            margin: 10px 0;
        }
        .app-logo {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            letter-spacing: 1px;
        }
        /* أزرار القائمة الرئيسية */
        .menu-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-play {
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #0b091a;
        }
        .btn-play:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
        }
        .btn-secondary {
            background: rgba(138, 43, 226, 0.2);
            border: 2px solid #8a2be2;
            color: #ffffff;
        }
        .btn-secondary:hover {
            background: #8a2be2;
        }
        .bottom-actions {
            display: flex;
            gap: 15px;
            width: 100%;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- أزرار الصوت والإعدادات -->
        <div class="top-bar">
            <button class="icon-btn" id="soundToggle" title="الصوت والموسيقى">🔊</button>
            <button class="icon-btn" id="settingsBtn" title="الإعدادات">⚙️</button>
        </div>

        <!-- الأيقونة والعنوان باستخدام اسم ملف الأيقونة الخاص بك -->
        <div class="logo-area">
            <img src="images/icon.png" alt="Potion Master Logo" class="app-logo">
            <h1>Potion Master</h1>
            <p style="color: #b19cd9; font-size: 14px; margin-top: 5px;">Ghost Puzzle</p>
        </div>

        <!-- الأزرار الرئيسية -->
        <div class="menu-buttons">
            <button class="btn btn-play" id="playBtn">ابدأ اللعبة (Play)</button>
            <button class="btn btn-secondary" id="leaderboardBtn">🏆 لوحة المتصدرين</button>
        </div>

        <!-- أزرار التقييم والمشاركة -->
        <div class="bottom-actions">
            <button class="btn btn-secondary" id="rateBtn" style="font-size: 15px; padding: 12px;">⭐ تقييم اللعبة</button>
            <button class="btn btn-secondary" id="shareBtn" style="font-size: 15px; padding: 12px;">🔗 مشاركة</button>
        </div>
    </div>

    <script>
        // تفاعلات الأزرار الأولية
        document.getElementById('soundToggle').addEventListener('click', () => {
            alert('تم تبديل وضع الصوت والموسيقى!');
        });
        document.getElementById('settingsBtn').addEventListener('click', () => {
            alert('فتح نافذة الإعدادات...');
        });
        document.getElementById('playBtn').addEventListener('click', () => {
            alert('جارٍ تحضير المستويات وعوالم اللعبة...');
        });
        document.getElementById('leaderboardBtn').addEventListener('click', () => {
            alert('فتح لوحة المتصدرين (الذهبي، الفضي، البرونزي)...');
        });
        document.getElementById('rateBtn').addEventListener('click', () => {
            alert('شكراً لدعمك اللعبة!');
        });
        document.getElementById('shareBtn').addEventListener('click', () => {
            alert('تم نسخ رابط اللعبة!');
        });
    </script>
</body>
</html>
