here<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potion Master: Ghost Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b091a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background: linear-gradient(135deg, #18122b, #0b091a);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
            position: relative;
        }
        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }
        .top-left, .top-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn, .lang-select {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #8a2be2;
            color: #fff;
            height: 40px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }
        .icon-btn {
            width: 40px;
            font-size: 16px;
        }
        .icon-btn:hover, .lang-select:hover {
            background: #8a2be2;
            transform: scale(1.05);
        }
        .lang-select {
            padding: 0 10px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
        .lang-select option {
            background-color: #18122b;
            color: #ffffff;
        }
        /* Header Area for Square Image */
        .header-area {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gamebanner {
            width: 110px;
            height: 110px;
            border-radius: 22px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            object-fit: cover;
            margin-bottom: 10px;
            background-color: #18122b;
        }
        h1 {
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            letter-spacing: 1px;
        }
        .subtitle {
            color: #b19cd9;
            font-size: 13px;
            margin-top: 3px;
        }
        /* Main Menu Buttons */
        .menu-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 10px;
        }
        .btn {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-play {
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #0b091a;
        }
        .btn-play:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
        }
        .btn-secondary {
            background: rgba(138, 43, 226, 0.2);
            border: 2px solid #8a2be2;
            color: #ffffff;
        }
        .btn-secondary:hover {
            background: #8a2be2;
        }
        .bottom-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            padding: 0 10px;
        }

        /* Settings Modal Style */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 9, 26, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #18122b;
            border: 2px solid #8a2be2;
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            text-align: center;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
        }
        .modal-content h3 {
            color: #00ffcc;
            margin-bottom: 15px;
        }
        .close-modal {
            margin-top: 20px;
            background: #8a2be2;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-left">
                <button class="icon-btn" id="soundToggle" title="Sound">🔊</button>
                <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
            </div>
            <div class="top-right">
                <select class="lang-select" id="langSelect">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                </select>
            </div>
        </div>

        <!-- Header Area with Image -->
        <div class="header-area">
            <img src="icon.png?v=2" alt="Potion Master Logo" class="gamebanner">
            <h1 id="gameTitle">Potion Master</h1>
            <p class="subtitle" id="gameSub">Ghost Puzzle</p>
        </div>

        <!-- Menu Buttons -->
        <div class="menu-buttons">
            <button class="btn btn-play" id="playBtn">Play Game</button>
            <button class="btn btn-secondary" id="leaderboardBtn">🏆 Leaderboard</button>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <button class="btn btn-secondary" id="rateBtn" style="font-size: 14px; padding: 11px;">⭐ Rate Us</button>
            <button class="btn btn-secondary" id="shareBtn" style="font-size: 14px; padding: 11px;">🔗 Share</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 id="settingsTitle">Game Settings</h3>
            <p id="settingsDesc" style="color: #b19cd9; font-size: 14px; margin-bottom: 15px;">Manage your game preferences here.</p>
            <button class="close-modal" id="closeModal">Close</button>
        </div>
    </div>

    <script>
        const translations = {
            en: { play: "Play Game", leaderboard: "🏆 Leaderboard", rate: "⭐ Rate Us", share: "🔗 Share", sub: "Ghost Puzzle", settings: "Game Settings", desc: "Manage your game preferences here.", close: "Close", dir: "ltr" },
            ar: { play: "ابدأ اللعبة", leaderboard: "🏆 لوحة المتصدرين", rate: "⭐ تقييم اللعبة", share: "🔗 مشاركة", sub: "لغز الأشباح", settings: "إعدادات اللعبة", desc: "قم بتعديل تفضيلات اللعبة من هنا.", close: "إغلاق", dir: "rtl" },
            fr: { play: "Jouer", leaderboard: "🏆 Classement", rate: "⭐ Noter", share: "🔗 Partager", sub: "Puzzle Fantôme", settings: "Paramètres", desc: "Gérez vos préférences de jeu ici.", close: "Fermer", dir: "ltr" }
        };

        const langSelect = document.getElementById('langSelect');
        const htmlRoot = document.getElementById('htmlRoot');
        const playBtn = document.getElementById('playBtn');
        const leaderboardBtn = document.getElementById('leaderboardBtn');
        const rateBtn = document.getElementById('rateBtn');
        const shareBtn = document.getElementById('shareBtn');
        const gameSub = document.getElementById('gameSub');
        const settingsTitle = document.getElementById('settingsTitle');
        const settingsDesc = document.getElementById('settingsDesc');
        const closeModalBtn = document.getElementById('closeModal');

        langSelect.addEventListener('change', (e) => {
            const lang = e.target.value;
            const t = translations[lang];
            htmlRoot.setAttribute('lang', lang);
            htmlRoot.setAttribute('dir', t.dir);
            playBtn.innerText = t.play;
            leaderboardBtn.innerText = t.leaderboard;
            rateBtn.innerText = t.rate;
            shareBtn.innerText = t.share;
            gameSub.innerText = t.sub;
            settingsTitle.innerText = t.settings;
            settingsDesc.innerText = t.desc;
            closeModalBtn.innerText = t.close;
        });

        // Sound Toggle
        let soundOn = true;
        document.getElementById('soundToggle').addEventListener('click', () => {
            soundOn = !soundOn;
            document.getElementById('soundToggle').innerText = soundOn ? '🔊' : '🔇';
        });

        // Settings Modal Controls
        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });
        closeModalBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        // Functional Buttons
        playBtn.addEventListener('click', () => {
            alert('Starting Potion Master levels...');
        });

        leaderboardBtn.addEventListener('click', () => {
            alert('Opening Leaderboards (Gold, Silver, Bronze)...');
        });

        rateBtn.addEventListener('click', () => {
            alert('Thank you for rating Potion Master!');
        });

        shareBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href);
            alert('Game link copied to clipboard successfully!');
        });
    </script>
</body>
</html>
